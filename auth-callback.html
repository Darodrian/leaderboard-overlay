<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twitch Callback</title>
</head>
<body>
<p>Completing Twitch connection…</p>
<script type="module">
import { SUPABASE_ANON_KEY } from './js/config.js';

(async () => {
  const qs = new URLSearchParams(location.search);
  const code = qs.get('code');
  const state = qs.get('state');
  const error = qs.get('error');

  if (error) {
    document.body.innerHTML = '<p>Twitch authorization failed.</p>';
    setTimeout(() => { location.href = 'dashboard.html'; }, 1500);
    return;
  }

  if (!code) {
    document.body.innerHTML = '<p>No Twitch code received.</p>';
    setTimeout(() => { location.href = 'dashboard.html'; }, 1500);
    return;
  }

  try {
    const base = 'https://liuhcwkpuivcletiwpab.supabase.co/functions/v1';
    const res = await fetch(`${base}/auth-twitch?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`, {
      method: 'GET',
      credentials: 'include',
      headers: { apikey: SUPABASE_ANON_KEY },
    });
    const data = await res.json();
    if (!res.ok) {
      document.body.innerHTML = `<p>Connection failed: ${data.error || 'unknown'}</p>`;
      setTimeout(() => { location.href = 'dashboard.html'; }, 2000);
      return;
    }
    location.href = data.redirectUrl || './dashboard.html';
  } catch (e) {
    document.body.innerHTML = '<p>Connection failed.</p>';
    setTimeout(() => { location.href = 'dashboard.html'; }, 2000);
  }
})();
</script>
</body>
</html>
