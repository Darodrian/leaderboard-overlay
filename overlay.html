<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard Overlay</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./css/overlay.css">
<script src="https://cdn.jsdelivr.net/npm/comfy.js@latest/dist/comfy.min.js"></script>
</head>
<body>
<div id="setup-notice" hidden>
  <div class="setup-box">
    <h1>Leaderboard Overlay</h1>
    <p>No streamer found for this token. Connect your Twitch account from the dashboard.</p>
  </div>
</div>
<div id="overlay-root" class="lb-root"></div>

<script type="module">
import { loadOverlayState, FUNCTIONS_BASE, SUPABASE_ANON_KEY } from './js/overlayData.js';
import { initComfyJS } from './js/comfyjs.js';
import { createBridge } from './js/bridge.js';
import { cssVars, mergeSettings, BOARD_LABELS, formatBoardQuantity } from './js/settings.js';

const token = (() => {
  try { return new URLSearchParams(location.search).get('token') || ''; } catch { return ''; }
})();

const root = document.getElementById('overlay-root');
const setupNotice = document.getElementById('setup-notice');

let state = null;
let settings = null;
let bridge = null;
let rotationTimer = null;
let rotationSignature = '';
let refreshTimer = null;
let activeBoard = '';
let activeWindow = '';

function applyCssVars(s) {
  const vars = cssVars(s);
  for (const [key, value] of Object.entries(vars)) {
    document.documentElement.style.setProperty(key, value);
  }
  if (s.fontFamily !== 'system') {
    let link = document.getElementById('google-fonts');
    if (link) link.remove();
    const l = document.createElement('link');
    l.id = 'google-fonts';
    l.rel = 'stylesheet';
    l.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(s.fontFamily)}:wght@400;700&display=swap`;
    document.head.appendChild(l);
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function renderBoard(board, rows, window) {
  const hidden = new Set(settings.hiddenAccounts.map((a) => a.toLowerCase()));
  const boardCfg = settings.boards[board];
  const rankCount = boardCfg ? boardCfg.rankCount : 25;

  const visible = [...rows]
    .filter((row) => !hidden.has(row.username.toLowerCase()))
    .sort((a, b) => b.quantity - a.quantity)
    .slice(0, rankCount);

  const max = Math.max(1, ...visible.map((row) => row.quantity));
  const showRank = settings.display.ranks;
  const boardLabel = settings.boardLabels ? (settings.boardLabels[board] || BOARD_LABELS[board]) : BOARD_LABELS[board];
  const WINDOW_LABELS_ES = {
    this_stream: 'Este stream',
    '7d': '7d',
    '30d': '30d',
    alltime: 'Siempre',
  };
  const windowLabel = WINDOW_LABELS_ES[window] ?? window;

  const itemsHtml = visible.map((row, index) => {
    const rank = index + 1;
    const showMedal = showRank && settings.display.medals && rank <= 3;
    const medal = showMedal ? ['🥇','🥈','🥉'][rank - 1] : '';
    const rankNum = showRank && settings.display.rankNumbers ? '#' + rank : '';
    const qty = settings.display.amounts ? formatBoardQuantity(board, row.quantity) : '';
    const bar = settings.display.bars ? '<span class="lb-bar"><span class="lb-bar-fill" style="width:' + Math.max(2, (row.quantity / max) * 100) + '%"></span></span>' : '';

    return '<li class="lb-row" data-rank="' + rank + '">' +
      (showMedal ? '<span class="lb-medal" aria-hidden>' + medal + '</span>' : '') +
      (showRank && settings.display.rankNumbers ? '<span class="lb-rank">' + rankNum + '</span>' : '') +
      '<span class="lb-name">' + escapeHtml(row.username) + '</span>' +
      (settings.display.amounts ? '<span class="lb-quantity">' + qty + '</span>' : '') +
      (settings.display.bars ? bar : '') +
      '</li>';
  }).join('');

  return '<div class="lb-board">' +
    '<header class="lb-board-header">' +
    '<span class="lb-board-label-main">' + escapeHtml(boardLabel) + '</span>' +
    '<span class="lb-board-label-sub">' + escapeHtml(windowLabel) + '</span>' +
    '</header>' +
    '<ol class="lb-list" data-window="' + window + '" data-board="' + board + '">' +
    itemsHtml +
    '</ol>' +
    '</div>';
}

function render() {
  if (!state) return;
  settings = state.settings;
  applyCssVars(settings);

  if (!state.boards[activeBoard]) activeBoard = state.activeBoard;
  if (!activeWindow) activeWindow = state.activeWindow;

  if (settings.screenLayout === 'single') {
    const bs = state.boards[activeBoard];
    const boardRows = bs ? bs.rows : [];
    root.innerHTML = '<div class="lb-panel">' + renderBoard(activeBoard, boardRows, activeWindow) + '</div>';
  } else {
    const activeBoards = Object.entries(settings.boards).filter(([, cfg]) => cfg.active);
    const boardsHtml = activeBoards.map(([board]) => {
      const bs = state.boards[board];
      const boardRows = bs ? bs.rows : [];
      return renderBoard(board, boardRows, activeWindow);
    }).join('');
    const layoutClass = 'lb-layout-stacked';
    root.innerHTML = '<div class="' + layoutClass + '">' + boardsHtml + '</div>';
  }

  startRotation();
}

function startRotation() {
  if (!state) return;

  const s = state.settings;
  const activeBoards = Object.entries(s.boards)
    .filter(([, cfg]) => cfg.active)
    .map(([board]) => board);

  if (!s.rotation.enabled || activeBoards.length === 0) {
    if (rotationTimer !== null) {
      clearInterval(rotationTimer);
      rotationTimer = null;
    }
    return;
  }

  const signature = [
    s.screenLayout,
    s.rotation.enabled,
    s.rotation.intervalMs,
    s.rotationMode,
    activeBoards.join(','),
    activeBoard,
    activeWindow,
  ].join('|');

  if (rotationTimer !== null && signature === rotationSignature) return;
  rotationSignature = signature;

  if (rotationTimer !== null) {
    clearInterval(rotationTimer);
    rotationTimer = null;
  }

  // Per-board window index, so window rotation remembers where each board left off.
  const boardWindowIdx = {};
  activeBoards.forEach((b) => {
    const windows = s.boards[b]?.windows || ['this_stream'];
    boardWindowIdx[b] = windows.indexOf(activeWindow) !== -1 ? windows.indexOf(activeWindow) : 0;
  });

  let bi = activeBoards.indexOf(activeBoard);
  if (bi === -1) bi = 0;

  const intervalMs = s.rotation.intervalMs;
  const mode = s.rotationMode;
  const isStacked = s.screenLayout !== 'single';

  const tick = () => {
    if (isStacked) {
      // In stacked layout every board shows at once; rotate each board's window independently.
      let changed = false;
      activeBoards.forEach((board) => {
        const windows = s.boards[board]?.windows || ['this_stream'];
        if (windows.length <= 1) return;
        const wi = boardWindowIdx[board] ?? 0;
        const nextWi = (wi + 1) % windows.length;
        boardWindowIdx[board] = nextWi;
        if (board === activeBoard) activeWindow = windows[nextWi];
        changed = true;
      });
      if (!changed) return;
    } else {
      const windows = s.boards[activeBoard]?.windows || ['this_stream'];

      if (mode === 'windows') {
        const wi = boardWindowIdx[activeBoard] ?? 0;
        const nextWi = (wi + 1) % windows.length;
        boardWindowIdx[activeBoard] = nextWi;
        activeWindow = windows[nextWi];
      } else if (mode === 'boards') {
        bi = (bi + 1) % activeBoards.length;
        activeBoard = activeBoards[bi];
        const bw = boardWindowIdx[activeBoard] ?? 0;
        const bwindows = s.boards[activeBoard]?.windows || ['this_stream'];
        activeWindow = bwindows[bw] || bwindows[0];
      } else if (mode === 'both') {
        const wi = boardWindowIdx[activeBoard] ?? 0;
        if (wi === windows.length - 1) {
          bi = (bi + 1) % activeBoards.length;
          activeBoard = activeBoards[bi];
          const bwindows = s.boards[activeBoard]?.windows || ['this_stream'];
          boardWindowIdx[activeBoard] = 0;
          activeWindow = bwindows[0];
        } else {
          boardWindowIdx[activeBoard] = wi + 1;
          activeWindow = windows[wi + 1];
        }
      }
    }

    if (isStacked) {
      // Re-render all active boards with their current windows.
      const boardsHtml = activeBoards.map((board) => {
        const bs = state.boards[board];
        const boardRows = bs ? bs.rows : [];
        const bw = boardWindowIdx[board] ?? 0;
        const bwindows = s.boards[board]?.windows || ['this_stream'];
        const win = bwindows[bw] || bwindows[0];
        return renderBoard(board, boardRows, win);
      }).join('');
      root.innerHTML = '<div class="lb-layout-stacked">' + boardsHtml + '</div>';
    } else {
      const bs = state.boards[activeBoard];
      root.innerHTML = '<div class="lb-panel">' + renderBoard(activeBoard, bs ? bs.rows : [], activeWindow) + '</div>';
    }
  };

  rotationTimer = window.setInterval(tick, intervalMs);
}

function startComfyJS() {
  console.log('[debug] startComfyJS called, state:', !!state);
  if (!state) {
    console.warn('[debug] startComfyJS: no state, returning');
    return;
  }
  const login = String(state.settings?.twitchLogin || '');
  console.log('[debug] startComfyJS: twitchLogin =', JSON.stringify(login));
  if (!login) {
    console.warn('[debug] startComfyJS: empty login, returning');
    return;
  }
  const channel = '#' + login;
  initComfyJS(channel, {
    onMessage: async (msg) => {
      try {
        await fetch(FUNCTIONS_BASE + '/webhooks-chat/' + token, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
          body: JSON.stringify({
            userId: msg.userId,
            username: msg.username,
            isBot: msg.isBot,
            isBroadcaster: msg.isBroadcaster,
            isMod: msg.isMod,
          }),
        });
      } catch (e) {
        console.warn('[comfyjs] chat event failed', e);
      }
    },
    onConnect: () => {
      console.log('[comfyjs] connected to', channel);
      console.log('[debug] startComfyJS: onConnect fired for', channel);
    },
    onDisconnect: () => console.warn('[comfyjs] disconnected'),
  }).catch((e) => console.warn('[comfyjs] init failed', e));
  console.log('[debug] startComfyJS: initComfyJS called for', channel);
}

function applyState(next) {
  if (!next) return;
  state = next;
  state.settings = mergeSettings(state.settings || {});
  render();
}

function applyLiveSettings(payload) {
  if (!state || !payload || !payload.settings) return;
  state.settings = mergeSettings(payload.settings);
  render();
}

function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refresh, 400);
}

async function refresh() {
  try {
    const next = await loadOverlayState(token);
    if (next) applyState(next);
  } catch (e) {
    console.warn('[overlay] refresh failed', e?.message ?? e);
  }
}

async function startLive() {
  const live = createBridge('overlay:' + token);
  live.on('settings.update', applyLiveSettings);
  live.on('leaderboard.update', scheduleRefresh);
  live.on('command.refresh', scheduleRefresh);
  live.on('command.clear-stream', scheduleRefresh);
  live.on('status', (status) => {
    if (status === 'SUBSCRIBED') live.sendHello();
  });

  try {
    await live.connect();
    bridge = live;
    live.sendHello();
  } catch (e) {
    console.warn('[overlay] live updates unavailable', e?.message ?? e);
  }
}

async function main() {
  if (!token) {
    setupNotice.hidden = false;
    return;
  }

  try {
    const next = await loadOverlayState(token);
    if (!next) {
      setupNotice.hidden = false;
      return;
    }
    setupNotice.hidden = true;
    applyState(next);
    startComfyJS();
    startLive();
  } catch (e) {
    console.warn('[overlay] load failed', e?.message ?? e);
    setupNotice.hidden = false;
  }
}

// Receive live settings updates from the dashboard preview via postMessage.
// This only affects the preview iframe (the dashboard postMessages to this
// iframe's contentWindow), not the separate OBS overlay instance.
window.addEventListener('message', (e) => {
  if (!state) return;
  if (e.data && e.data.type === 'settings.update' && e.data.settings) {
    state.settings = mergeSettings(e.data.settings);
    render();
  }
});

main();
</script>
</body>
</html>
