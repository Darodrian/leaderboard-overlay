<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard Overlay · Settings</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
<div class="wrap">
  <div class="col-left">
    <div>
      <h1>Settings</h1>
      <a href="./dashboard.html" class="btn btn-outline" style="margin-bottom:16px; display:inline-block;">← Back to dashboard</a>
      <div class="msg" id="msg" hidden></div>
      <div class="save-status" id="save-status" style="font-size:12px; color:var(--muted); margin-bottom:16px;"></div>
    </div>

    <div id="settings-form" class="panel space-y-3">
      <div class="section">
        <h2>Rank display</h2>
        <label class="field row">
          <input type="checkbox" id="display-ranks" checked>
          <span>Show ranks (top 25)</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-medals" checked>
          <span>Medals</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-rank-numbers" checked>
          <span>Rank numbers</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-bars" checked>
          <span>Progress bars</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-amounts" checked>
          <span>Point amounts</span>
        </label>
        <label class="field">
          <span>Hidden accounts (comma separated)</span>
          <input id="hidden-accounts" type="text" placeholder="nightbot, streamelements" class="input">
        </label>
      </div>

      <div class="section">
        <h2>Points</h2>
        <div class="grid-2">
          <label class="field">
            <span>Points per dollar (tips)</span>
            <input id="points-tip" type="number" value="100" class="input">
          </label>
          <label class="field">
            <span>Points per bit</span>
            <input id="points-bit" type="number" value="1" class="input">
          </label>
          <label class="field">
            <span>Points per sub</span>
            <input id="points-sub" type="number" value="500" class="input">
          </label>
          <label class="field">
            <span>Points per gifted sub</span>
            <input id="points-gift" type="number" value="300" class="input">
          </label>
          <label class="field">
            <span>Points per raider</span>
            <input id="points-raid" type="number" value="50" class="input">
          </label>
          <label class="field">
            <span>Minimum tip (cents)</span>
            <input id="tip-threshold" type="number" value="0" class="input">
          </label>
        </div>
        <label class="field">
          <span>Anonymous display name</span>
          <input id="anonymous-mask" type="text" value="Mystery Supporter" class="input">
        </label>
      </div>

      <div class="section">
        <h2>Board modes</h2>
        <p class="note">Enable the boards you want to show on the overlay.</p>
        <div id="boards-list" class="space-y-2"></div>
      </div>

      <div class="section">
        <h2>Board labels</h2>
        <p class="note">Customize the display name for each board. Leave blank for default.</p>
        <div id="board-labels" class="space-y-2"></div>
      </div>

      <div class="section">
        <h2>Layout</h2>
        <label class="field">
          <span>Screen layout</span>
          <select id="screen-layout" class="input">
            <option value="single">Single board</option>
            <option value="side-by-side">Side by side</option>
            <option value="stacked">Stacked</option>
          </select>
        </label>
        <label class="field">
          <span>Overlay width (px)</span>
          <input id="layout-width" type="range" min="200" max="1200" value="420" class="slider">
          <span id="layout-width-val">420 px</span>
        </label>
        <label class="field">
          <span>Overlay padding (px)</span>
          <input id="layout-padding" type="range" min="0" max="48" value="12" class="slider">
          <span id="layout-padding-val">12 px</span>
        </label>
        <label class="field">
          <span>Corner radius (px)</span>
          <input id="layout-radius" type="range" min="0" max="999" value="16" class="slider">
          <span id="layout-radius-val">16 px</span>
        </label>
      </div>

      <div class="section">
        <h2>Visuals</h2>
        <label class="field">
          <span>Opacity (%)</span>
          <input id="visual-opacity" type="range" min="0" max="100" value="100" class="slider">
          <span id="visual-opacity-val">100%</span>
        </label>
        <label class="field">
          <span>Font size (px)</span>
          <input id="visual-font-size" type="range" min="8" max="72" value="18" class="slider">
          <span id="visual-font-size-val">18 px</span>
        </label>
        <label class="field">
          <span>Font family</span>
          <select id="font-family" class="input">
            <option value="system">System font</option>
            <option value="Inter">Inter</option>
            <option value="Roboto">Roboto</option>
            <option value="Open Sans">Open Sans</option>
            <option value="Lato">Lato</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Poppins">Poppins</option>
            <option value="Oswald">Oswald</option>
            <option value="Raleway">Raleway</option>
            <option value="Libre Franklin">Libre Franklin</option>
            <option value="Source Sans Pro">Source Sans Pro</option>
            <option value="Ubuntu">Ubuntu</option>
            <option value="Merriweather">Merriweather</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Press Start 2P">Press Start 2P</option>
            <option value="VT323">VT323</option>
            <option value="Share Tech Mono">Share Tech Mono</option>
            <option value="Special Elite">Special Elite</option>
            <option value="Gagalin">Gagalin</option>
            <option value="Permanent Marker">Permanent Marker</option>
          </select>
        </label>
        <label class="field">
          <span>Label alignment</span>
          <select id="label-alignment" class="input">
            <option value="center">Center</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </label>
      </div>

      <div class="section">
        <h2>Theme</h2>
        <label class="field">
          <span>Theme preset</span>
          <select id="theme-preset" class="input">
            <option value="midnight">Midnight</option>
            <option value="ember">Ember</option>
            <option value="mint">Mint</option>
            <option value="grape">Grape</option>
            <option value="paper">Paper</option>
          </select>
        </label>
        <div class="grid-2" id="theme-colors"></div>
      </div>

      <div class="section">
        <h2>Rotation</h2>
        <label class="field row">
          <input type="checkbox" id="rotation-enabled">
          <span>Enable rotation</span>
        </label>
        <label class="field">
          <span>Rotation mode</span>
          <select id="rotation-mode" class="input">
            <option value="boards">Rotate boards</option>
            <option value="windows">Rotate time windows</option>
            <option value="both">Rotate boards & windows</option>
          </select>
        </label>
        <label class="field">
          <span>Rotation interval (seconds)</span>
          <input id="rotation-interval" type="number" min="3" max="300" value="30" class="input">
        </label>
        <p class="note">Cycles through active boards and/or time windows.</p>
      </div>

      <button type="button" id="btn-save" class="btn btn-indigo btn-wide">Save settings</button>
    </div>
  </div>
</div>

<script type="module">
import { applySettings, cssVars, DEFAULT_SETTINGS, THEMES, ALL_BOARD_TYPES, BOARD_LABELS, BOARD_UNITS, formatBoardQuantity, nextRotationWindow } from './js/settings.js';
import { FUNCTIONS_BASE } from './js/overlayData.js';

const $ = (id) => document.getElementById(id);
const MSG = $('msg');
const SAVE_STATUS = $('save-status');
const BTN_SAVE = $('btn-save');

function flash(text, kind = '') {
  MSG.textContent = text;
  MSG.hidden = false;
  MSG.className = 'msg' + (kind ? ' ' + kind : '');
  clearTimeout(window.__msgTimer);
  window.__msgTimer = setTimeout(() => { MSG.hidden = true; MSG.textContent = ''; }, 5000);
}

function setSaveStatus(text) {
  SAVE_STATUS.textContent = text;
}

// ---- Settings state ----
let settings = structuredClone(DEFAULT_SETTINGS);

// ---- UI bindings ----
const FIELDS = {
  'display-ranks': { path: ['display', 'ranks'], type: 'checkbox' },
  'display-medals': { path: ['display', 'medals'], type: 'checkbox' },
  'display-rank-numbers': { path: ['display', 'rankNumbers'], type: 'checkbox' },
  'display-bars': { path: ['display', 'bars'], type: 'checkbox' },
  'display-amounts': { path: ['display', 'amounts'], type: 'checkbox' },
  'hidden-accounts': { path: ['hiddenAccounts'], type: 'text' },
  'points-tip': { path: ['pointConfig', 'tip'], type: 'number' },
  'points-bit': { path: ['pointConfig', 'bit'], type: 'number' },
  'points-sub': { path: ['pointConfig', 'sub'], type: 'number' },
  'points-gift': { path: ['pointConfig', 'gift'], type: 'number' },
  'points-raid': { path: ['pointConfig', 'raid'], type: 'number' },
  'tip-threshold': { path: ['tipThresholdCents'], type: 'number' },
  'anonymous-mask': { path: ['anonymousMaskName'], type: 'text' },
  'screen-layout': { path: ['screenLayout'], type: 'select' },
  'layout-width': { path: ['layout', 'width'], type: 'slider' },
  'layout-padding': { path: ['layout', 'padding'], type: 'slider' },
  'layout-radius': { path: ['layout', 'borderRadius'], type: 'slider' },
  'visual-opacity': { path: ['visuals', 'opacity'], type: 'slider' },
  'visual-font-size': { path: ['visuals', 'fontSize'], type: 'slider' },
  'font-family': { path: ['fontFamily'], type: 'select' },
  'label-alignment': { path: ['labelAlignment'], type: 'select' },
  'theme-preset': { path: ['theme', 'preset'], type: 'select' },
  'rotation-enabled': { path: ['rotation', 'enabled'], type: 'checkbox' },
  'rotation-mode': { path: ['rotationMode'], type: 'select' },
  'rotation-interval': { path: ['rotation', 'intervalMs'], type: 'number' },
};

function getValue(el) {
  const type = el.dataset.type || el.type;
  if (type === 'checkbox') return el.checked;
  if (type === 'select-one') return el.value;
  if (type === 'range') return Number(el.value);
  if (type === 'number') return Number(el.value);
  return el.value;
}

function setValue(el, val) {
  const type = el.dataset.type || el.type;
  if (type === 'checkbox') { el.checked = !!val; return; }
  if (type === 'select-one') { el.value = val; return; }
  if (type === 'range') { el.value = val; el.nextElementSibling?.textContent === undefined || (el.nextElementSibling.textContent = val + (el.id.includes('layout') ? ' px' : el.id.includes('visual') ? (el.id === 'visual-opacity' ? '%' : ' px') : '')); return; }
  if (type === 'number') { el.value = val; return; }
  el.value = val;
}

function setNested(obj, path, val) {
  let cur = obj;
  for (let i = 0; i < path.length - 1; i++) {
    if (!cur[path[i]]) cur[path[i]] = {};
    cur = cur[path[i]];
  }
  cur[path[path.length - 1]] = val;
}

function getNested(obj, path) {
  let cur = obj;
  for (const p of path) {
    if (!cur || typeof cur !== 'object') return undefined;
    cur = cur[p];
  }
  return cur;
}

function syncUI() {
  for (const [id, def] of Object.entries(FIELDS)) {
    const el = $(id);
    if (!el) continue;
    const val = getNested(settings, def.path);
    setValue(el, val);
  }

  // Slider value labels
  document.querySelectorAll('input[type="range"]').forEach((el) => {
    const label = el.nextElementSibling;
    if (label && label.tagName === 'SPAN') {
      let suffix = '';
      if (el.id === 'visual-opacity') suffix = '%';
      else if (el.id.includes('layout')) suffix = ' px';
      else if (el.id === 'visual-font-size') suffix = ' px';
      label.textContent = el.value + suffix;
    }
  });

  // Theme color overrides
  renderThemeColors();

  // CSS vars preview
  const vars = cssVars(settings);
  for (const [key, value] of Object.entries(vars)) {
    document.documentElement.style.setProperty(key, value);
  }
}

function renderThemeColors() {
  const container = $('theme-colors');
  const preset = THEMES[settings.theme.preset] ?? THEMES.midnight;
  const fields = [
    { key: '--lb-bg', label: 'Background color', default: preset.background },
    { key: '--lb-text', label: 'Text color', default: preset.text },
    { key: '--lb-accent', label: 'Accent color', default: preset.accent },
    { key: '--lb-bar', label: 'Bar track color', default: preset.bar },
    { key: '--lb-rank', label: 'Rank color', default: preset.accent },
  ];
  container.innerHTML = fields.map((f) => {
    const val = settings.theme.overrides[f.key] ?? f.default;
    return `
      <label class="field">
        <span>${f.label}</span>
        <input type="color" id="color-${f.key.replace('--lb-','')}" value="${val}" class="color-input">
      </label>
    `;
  }).join('');

  fields.forEach((f) => {
    const el = $('color-' + f.key.replace('--lb-', ''));
    if (el) {
      el.addEventListener('input', (e) => {
        const overrides = { ...settings.theme.overrides };
        overrides[f.key] = e.target.value;
        settings = applySettings(settings, { theme: { overrides } });
        syncUI();
      });
    }
  });
}

// ---- Boards list ----
function renderBoards() {
  const container = $('boards-list');
  container.innerHTML = ALL_BOARD_TYPES.map((board) => {
    const cfg = settings.boards[board] || { active: false, windows: ['this_stream'], rankCount: 10 };
    const windowsHtml = ['this_stream', '7d', '30d', 'alltime'].map((w) => {
      const active = cfg.windows.includes(w);
      return `
        <button type="button" class="win-btn ${active ? 'active' : ''}" data-board="${board}" data-window="${w}">
          ${w === 'this_stream' ? 'This Stream' : w}
        </button>
      `;
    }).join('');
    return `
      <div class="board-section">
        <label class="field row">
          <input type="checkbox" id="board-active-${board}" ${cfg.active ? 'checked' : ''}>
          <span>${BOARD_LABELS[board]}</span>
          <span class="board-symbol">${BOARD_UNITS[board].symbol}</span>
        </label>
        <div class="board-windows">${windowsHtml}</div>
        <label class="field">
          <span>Max ranks</span>
          <input id="board-rank-${board}" type="number" min="1" max="100" value="${cfg.rankCount}" class="input" data-board="${board}">
        </label>
      </div>
    `;
  }).join('');

  container.querySelectorAll('.win-btn').forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const board = e.target.dataset.board;
      const window = e.target.dataset.window;
      const cfg = settings.boards[board] || { active: true, windows: [], rankCount: 10 };
      const windows = cfg.windows.includes(window)
        ? cfg.windows.filter((w) => w !== window)
        : [...cfg.windows, window];
      settings = applySettings(settings, { boards: { ...settings.boards, [board]: { ...cfg, windows } } });
      syncUI();
    });
  });

  container.querySelectorAll('input[type="number"][data-board]').forEach((el) => {
    el.addEventListener('change', (e) => {
      const board = e.target.dataset.board;
      const cfg = settings.boards[board] || {};
      settings = applySettings(settings, { boards: { ...settings.boards, [board]: { ...cfg, rankCount: Number(e.target.value) || 10 } } });
      syncUI();
    });
  });

  container.querySelectorAll('input[type="checkbox"][id^="board-active-"]').forEach((el) => {
    el.addEventListener('change', (e) => {
      const board = e.target.id.replace('board-active-', '');
      const cfg = settings.boards[board] || {};
      settings = applySettings(settings, { boards: { ...settings.boards, [board]: { ...cfg, active: e.target.checked } } });
      syncUI();
    });
  });
}

// ---- Board labels ----
function renderBoardLabels() {
  const container = $('board-labels');
  container.innerHTML = ALL_BOARD_TYPES.map((board) => {
    const val = settings.boardLabels[board] ?? '';
    return `
      <div class="field row">
        <span class="board-label-name">${BOARD_LABELS[board]}</span>
        <input id="board-label-${board}" type="text" placeholder="${BOARD_LABELS[board]}" value="${val}" class="input" data-board="${board}">
      </div>
    `;
  }).join('');

  container.querySelectorAll('input[data-board]').forEach((el) => {
    el.addEventListener('input', (e) => {
      const board = e.target.dataset.board;
      const boardLabels = { ...settings.boardLabels };
      if (e.target.value) boardLabels[board] = e.target.value;
      else delete boardLabels[board];
      settings = applySettings(settings, { theme: { ...settings.theme, boardLabels } });
    });
  });
}

// ---- General field listeners ----
Object.entries(FIELDS).forEach(([id, def]) => {
  const el = $(id);
  if (!el) return;
  const event = def.type === 'slider' ? 'input' : def.type === 'number' ? 'change' : 'change';
  el.addEventListener(event, (e) => {
    const val = getValue(el);
    settings = applySettings(settings, { [def.path.join('.')]: val });
    syncUI();
  });
});

// Special: hidden accounts split
$('hidden-accounts').addEventListener('input', (e) => {
  settings = applySettings(settings, {
    hiddenAccounts: e.target.value.split(',').map((a) => a.trim()).filter(Boolean),
  });
  syncUI();
});

// Special: rotation interval seconds -> ms
$('rotation-interval').addEventListener('change', (e) => {
  settings = applySettings(settings, { rotation: { intervalMs: (Number(e.target.value) || 30) * 1000 } });
  syncUI();
});

// ---- Load settings from server ----
async function loadSettings() {
  try {
    const res = await fetch(FUNCTIONS_BASE + '/settings', {
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
    });
    if (!res.ok) {
      flash('Could not load settings', 'err');
      return;
    }
    const data = await res.json();
    if (data.settings) {
      settings = applySettings(DEFAULT_SETTINGS, data.settings);
      syncUI();
      renderBoards();
      renderBoardLabels();
    }
  } catch (e) {
    console.warn('[settings] load failed', e);
  }
}

// ---- Save settings ----
BTN_SAVE.addEventListener('click', async () => {
  BTN_SAVE.disabled = true;
  BTN_SAVE.textContent = 'Saving…';
  setSaveStatus('Saving…');
  try {
    const res = await fetch(FUNCTIONS_BASE + '/settings', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ settings }),
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      setSaveStatus('Save failed: ' + (data.error || 'unknown error'));
      flash('Save failed', 'err');
      return;
    }
    const data = await res.json();
    settings = applySettings(DEFAULT_SETTINGS, data.settings);
    syncUI();
    renderBoards();
    renderBoardLabels();
    setSaveStatus('Saved — overlay updated');
    flash('Settings saved');
  } catch (e) {
    setSaveStatus('Save failed');
    flash('Save failed', 'err');
  } finally {
    BTN_SAVE.disabled = false;
    BTN_SAVE.textContent = 'Save settings';
  }
});

// ---- Init ----
syncUI();
renderBoards();
renderBoardLabels();
loadSettings();
</script>
</body>
</html>
