<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard Overlay · Control</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./css/dashboard.css">
</head>
<body>
<div class="wrap">
  <div class="col-left">
    <div class="msg" id="msg" hidden></div>

    <div id="connection-panel" class="panel">
      <h2 id="connection-title">Connect Twitch</h2>
      <button type="button" id="btn-connect">Connect Twitch account</button>
      <div id="connection-connected" hidden style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px;">
        <span id="connection-status">Connected</span>
        <button type="button" id="btn-disconnect" style="margin-left:auto;">Disconnect</button>
      </div>
      <button type="button" id="btn-copy-url" disabled class="btn-wide" style="margin-top:8px;">Copy overlay URL</button>
    </div>

    <div id="settings-panel" class="panel">
      <h2>Settings</h2>
      <div class="save-status" id="save-status" style="font-size:12px; color:var(--muted); margin-bottom:16px;"></div>

      <div class="section">
        <h3>Rank display</h3>
        <label class="field row">
          <input type="checkbox" id="display-ranks" checked>
          <span>Show ranks (top 25)</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-medals" checked>
          <span>Medals</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-rank-numbers" checked>
          <span>Rank numbers</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-bars" checked>
          <span>Progress bars</span>
        </label>
        <label class="field row">
          <input type="checkbox" id="display-amounts" checked>
          <span>Point amounts</span>
        </label>
        <label class="field">
          <span>Hidden accounts (comma separated)</span>
          <input id="hidden-accounts" type="text" placeholder="nightbot, streamelements" class="input">
        </label>
      </div>

      <div class="section">
        <h3>Points</h3>
        <div class="grid-2">
          <label class="field">
            <span>Points per dollar (tips)</span>
            <input id="points-tip" type="number" value="100" class="input">
          </label>
          <label class="field">
            <span>Points per bit</span>
            <input id="points-bit" type="number" value="1" class="input">
          </label>
          <label class="field">
            <span>Points per sub</span>
            <input id="points-sub" type="number" value="500" class="input">
          </label>
          <label class="field">
            <span>Points per gifted sub</span>
            <input id="points-gift" type="number" value="300" class="input">
          </label>
          <label class="field">
            <span>Points per raider</span>
            <input id="points-raid" type="number" value="50" class="input">
          </label>
          <label class="field">
            <span>Minimum tip (cents)</span>
            <input id="tip-threshold" type="number" value="0" class="input">
          </label>
        </div>
        <label class="field">
          <span>Anonymous display name</span>
          <input id="anonymous-mask" type="text" value="Mystery Supporter" class="input">
        </label>
      </div>

      <div class="section">
        <h3>Board modes</h3>
        <p class="note">Enable the boards you want to show on the overlay.</p>
        <div id="boards-list" class="space-y-2"></div>
      </div>

      <div class="section">
        <h3>Board labels</h3>
        <p class="note">Customize the display name for each board. Leave blank for default.</p>
        <div id="board-labels" class="space-y-2"></div>
      </div>

      <div class="section">
        <h3>Layout</h3>
        <label class="field">
          <span>Screen layout</span>
          <select id="screen-layout" class="input">
            <option value="single">Single board</option>
            <option value="side-by-side">Side by side</option>
            <option value="stacked">Stacked</option>
          </select>
        </label>
        <label class="field">
          <span>Overlay width (px)</span>
          <input id="layout-width" type="range" min="200" max="1200" value="420" class="slider">
          <span id="layout-width-val">420 px</span>
        </label>
        <label class="field">
          <span>Overlay padding (px)</span>
          <input id="layout-padding" type="range" min="0" max="48" value="12" class="slider">
          <span id="layout-padding-val">12 px</span>
        </label>
        <label class="field">
          <span>Corner radius (px)</span>
          <input id="layout-radius" type="range" min="0" max="999" value="16" class="slider">
          <span id="layout-radius-val">16 px</span>
        </label>
      </div>

      <div class="section">
        <h3>Visuals</h3>
        <label class="field">
          <span>Opacity (%)</span>
          <input id="visual-opacity" type="range" min="0" max="100" value="100" class="slider">
          <span id="visual-opacity-val">100%</span>
        </label>
        <label class="field">
          <span>Font size (px)</span>
          <input id="visual-font-size" type="range" min="8" max="72" value="18" class="slider">
          <span id="visual-font-size-val">18 px</span>
        </label>
        <label class="field">
          <span>Font family</span>
          <select id="font-family" class="input">
            <option value="system">System font</option>
            <option value="Inter">Inter</option>
            <option value="Roboto">Roboto</option>
            <option value="Open Sans">Open Sans</option>
            <option value="Lato">Lato</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Poppins">Poppins</option>
            <option value="Oswald">Oswald</option>
            <option value="Raleway">Raleway</option>
            <option value="Libre Franklin">Libre Franklin</option>
            <option value="Source Sans Pro">Source Sans Pro</option>
            <option value="Ubuntu">Ubuntu</option>
            <option value="Merriweather">Merriweather</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Press Start 2P">Press Start 2P</option>
            <option value="VT323">VT323</option>
            <option value="Share Tech Mono">Share Tech Mono</option>
            <option value="Special Elite">Special Elite</option>
            <option value="Gagalin">Gagalin</option>
            <option value="Permanent Marker">Permanent Marker</option>
          </select>
        </label>
        <label class="field">
          <span>Label alignment</span>
          <select id="label-alignment" class="input">
            <option value="center">Center</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </label>
      </div>

      <div class="section">
        <h3>Theme</h3>
        <label class="field">
          <span>Theme preset</span>
          <select id="theme-preset" class="input">
            <option value="midnight">Midnight</option>
            <option value="ember">Ember</option>
            <option value="mint">Mint</option>
            <option value="grape">Grape</option>
            <option value="paper">Paper</option>
          </select>
        </label>
        <div class="grid-2" id="theme-colors"></div>
      </div>

      <div class="section">
        <h3>Rotation</h3>
        <label class="field row">
          <input type="checkbox" id="rotation-enabled">
          <span>Enable rotation</span>
        </label>
        <label class="field">
          <span>Rotation mode</span>
          <select id="rotation-mode" class="input">
            <option value="boards">Rotate boards</option>
            <option value="windows">Rotate time windows</option>
            <option value="both">Rotate boards & windows</option>
          </select>
        </label>
        <label class="field">
          <span>Rotation interval (seconds)</span>
          <input id="rotation-interval" type="number" min="3" max="300" value="30" class="input">
        </label>
        <p class="note">Cycles through active boards and/or time windows.</p>
      </div>

      <button type="button" id="btn-save" class="btn btn-indigo btn-wide">Save settings</button>
    </div>
  </div>
</div>

<script type="module" src="./js/dashboard.js"></script>
</body>
</html>
